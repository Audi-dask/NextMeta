services:
  nextmeta:
    image: ccr.ccs.tencentyun.com/dbak/nextmeta:latest # 最新版本20260808-222938
    container_name: nextmeta
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - nextmeta-data:/data
      - nextmeta-license:/app/license.lic
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nextmeta-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 4oOQq1ul0GNCpHn9
      MYSQL_DATABASE: nextmeta
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nextmeta-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p4oOQq1ul0GNCpHn9"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

volumes:
  nextmeta-data:
    driver: local
  mysql-data:
    driver: local

networks:
  nextmeta-net:
    driver: bridge
