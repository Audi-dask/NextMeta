# 服务端口
server:
  port: ":8080" 

# 数据库连接配置
database:
  host: "mysql"                  # Docker Compose 内通过服务名访问 MySQL
  port: "3306"                   # 数据库端口
  user: "root"                   # 数据库用户名
  password: "4oOQq1ul0GNCpHn9"   # 数据库密码（请修改为强密码，需与 docker-compose.yaml 的 MYSQL_ROOT_PASSWORD 一致）
  dbname: "nextmeta"             # 数据库名称

# 只要每 7 天内有活动，就不需要重新登录。如果闲置超过 7 天，需要重新登录。
jwt:
  secret_key: "o7nhR3guXCDz23QN"
  expires: 1h
  refresh_expires: 7d


# ========================================
# LDAP 配置（可选功能）
# 如果不需要 LDAP 认证，请保持以下内容为注释状态
# 后端代码会自动检测 LDAP 配置是否存在，不会因未配置而报错
# ========================================

# ldap:
#   url: "ldap://ldap:3890"                                 # LDAP 服务器地址
#   base_dn: "dc=example,dc=com"                         # 基础 DN
#   group_base_dn: "ou=groups,dc=example,dc=com"         # 组基础 DN
#   bind_dn: "cn=admin,ou=people,dc=example,dc=com"      # 绑定用户 DN
#   bind_pass: "admin123"                                   # 绑定用户密码

